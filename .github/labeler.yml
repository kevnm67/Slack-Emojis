# Auto-label PRs based on changed files (v7 format)
dependencies:
  - changed-files:
    - any-glob-to-any-file:
      - 'requirements*.txt'
      - 'setup.py'
      - 'setup.cfg'
      - 'pyproject.toml'
      - 'Pipfile*'
      - 'package.json'
      - 'package-lock.json'
      - 'yarn.lock'

github-actions:
  - changed-files:
    - any-glob-to-any-file:
      - '.github/**'

documentation:
  - changed-files:
    - any-glob-to-any-file:
      - '*.md'
      - 'docs/**'
      - 'LICENSE'
