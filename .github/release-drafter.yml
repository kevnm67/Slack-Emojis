---
name-template: v$RESOLVED_VERSION
tag-template: v$RESOLVED_VERSION
categories:
  - title: 🚀 Features
    labels:
      - feat
      - feature
      - enhancement
  - title: 🐛 Bug Fixes
    labels:
      - bug
  - title: 🩺 Maintenance
    labels:
      - chore
      - refactor
      - test
      - ci
  - title: 📝 Documentation
    labels:
      - docs
      - documentation
  - title: 📦 Dependency Updates
    labels:
      - dependencies
      - github-actions
exclude-labels:
  - skip-changelog
autolabeler:
  - label: feat
    branch:
      - '/feat\/.+/'
  - label: bug
    branch:
      - '/fix\/.+/'
    title:
      - '/^fix/i'
  - label: docs
    branch:
      - '/docs\/.+/'
    files:
      - '*.md'
  - label: chore
    branch:
      - '/chore\/.+/'
  - label: refactor
    branch:
      - '/refactor\/.+/'
  - label: test
    branch:
      - '/test\/.+/'
    files:
      - 'tests/**'
  - label: ci
    files:
      - '.github/workflows/**'
      - '.qlty/**'
change-template: '- $TITLE @$AUTHOR (#$NUMBER)'
version-resolver:
  major:
    labels:
      - major
  minor:
    labels:
      - minor
      - feat
      - feature
      - enhancement
  patch:
    labels:
      - patch
      - bug
      - chore
      - ci
      - dependencies
      - docs
      - documentation
      - github-actions
      - refactor
      - test
  default: patch
template: |
  ## What's Changed

  $CHANGES
