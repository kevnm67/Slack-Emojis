[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "slack-emojis"
version = "0.1.0"
description = "Emoji's commonly used for Slack, Jira, etc."
readme = "README.md"
requires-python = ">=3.14"
license = { file = "LICENSE" }

[project.scripts]
slack-emojis-update = "slack_emojis.update_emojis:main"
slack-emojis-fetch = "slack_emojis.fetch_slack_emojis:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "pre-commit>=3.7",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
