[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "slack-emojis"
version = "0.1.0"
description = "Emoji's commonly used for Slack, Jira, etc."
readme = "README.md"
requires-python = ">=3.14"
license = { file = "LICENSE" }
dependencies = [
    "pillow>=11.0",
]

[project.scripts]
slack-emojis-update = "slack_emojis.update_emojis:main"
slack-emojis-fetch = "slack_emojis.fetch_slack_emojis:main"
slack-emojis-validate = "slack_emojis.emoji_spec:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "pre-commit>=3.7",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.bandit]
# B101 (assert) is how pytest is written; excluding the suite keeps
# bandit meaningful on src/ instead of silencing the rule everywhere.
exclude_dirs = ["tests", ".venv"]
